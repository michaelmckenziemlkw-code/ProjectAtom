<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стенд синхронизации</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #11151d; color: #f3f5fa; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; }
  main { max-width: 880px; margin: auto; padding: clamp(24px, 6vw, 64px) 20px; }
  header { margin-bottom: 28px; }
  .eyebrow { color: #a8bbdf; text-transform: uppercase; letter-spacing: .16em; font-size: .72rem; font-weight: 750; }
  h1 { margin: 8px 0; font-size: clamp(1.9rem, 6vw, 3rem); line-height: 1.08; letter-spacing: -.04em; }
  h2 { margin: 0 0 14px; font-size: 1.22rem; }
  p { color: #bdc6d7; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .card { background: #1a202c; border: 1px solid #343e51; border-radius: 18px; padding: 20px; min-width: 0; }
  label { display: block; margin: 12px 0 6px; }
  select, input:not([type=range]), button { width: 100%; font: inherit; color: inherit; border-radius: 9px; padding: 11px 12px; border: 1px solid #53627a; }
  select, input:not([type=range]) { background: #11151d; }
  input[type=range] { width: 100%; accent-color: #a9c5ff; }
  .scale { display: flex; justify-content: space-between; color: #bdc6d7; font-size: .83rem; }
  button { background: #24324c; font-weight: 680; cursor: pointer; margin-top: 12px; }
  button.primary { background: #b5ccff; color: #101d36; border-color: #b5ccff; }
  button:disabled { opacity: .5; cursor: wait; }
  :focus-visible { outline: 2px solid #b5ccff; outline-offset: 3px; }
  #session { margin-top: 16px; }
  #details, .help { font-size: .88rem; margin: 9px 0 0; }
  #status:empty { display: none; }
  #status[data-error] { color: #ffb9ba; }
  #code, #import-code { font-family: ui-monospace, monospace; }
  #counter-view { position: fixed; inset: 0; display: grid; grid-template-rows: 1fr auto 1fr; justify-items: center; padding: 16px; color: #fff; }
  #counter-view[data-parity=even] { background: #164bb8; }
  #counter-view[data-parity=odd] { background: #a21c35; }
  #seconds { grid-row: 2; font: 750 clamp(100px, 38vmin, 340px)/1 system-ui, sans-serif; font-variant-numeric: tabular-nums; max-width: 100%; overflow-wrap: anywhere; text-align: center; }
  #stop { grid-row: 3; align-self: end; width: auto; background: #11151d; border-color: #fff9; }
  @media (max-width: 650px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main id="setup">
  <header>
    <div class="eyebrow">Два устройства · v0.2</div>
    <h1>Стенд синхронизации</h1>
    <p>Открой этот файл на Windows и Mac. На одном устройстве создай тест, на другом вставь код.</p>
  </header>
  <div class="grid">
    <form id="create" class="card">
      <h2>Создать тест</h2>
      <label for="mode">Способ запуска</label>
      <select id="mode">
        <option value="U" selected>Интернет-время</option>
        <option value="S">Системное время</option>
        <option value="M">Ручной старт</option>
      </select>
      <p id="mode-help" class="help"></p>
      <div id="delay-fields">
        <label for="delay">Задержка старта · <output id="delay-value" for="delay">30 с</output></label>
        <input id="delay" type="range" min="10" max="60" step="1" value="30">
        <div class="scale" aria-hidden="true"><span>10 с</span><span>60 с</span></div>
      </div>
      <button class="primary" id="create-button">Создать код</button>
    </form>
    <form id="join" class="card">
      <h2>Присоединиться</h2>
      <label for="import-code">Код теста</label>
      <input id="import-code" required maxlength="100" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="join-button">Принять код</button>
    </form>
  </div>
  <section id="session" class="card" hidden>
    <h2 id="session-title">Тест</h2>
    <p id="details"></p>
    <div id="share" hidden>
      <label for="code">Код для второго устройства</label>
      <input id="code" readonly spellcheck="false">
      <button type="button" id="copy">Скопировать код</button>
    </div>
    <button type="button" id="start" class="primary" hidden>Начать</button>
    <button type="button" id="cancel" hidden>Отменить тест</button>
    <p id="status" role="status"></p>
  </section>
</main>
<section id="counter-view" hidden aria-label="Счётчик">
  <div id="seconds">0</div>
  <button type="button" id="stop">Остановить</button>
</section>
<script>
"use strict";

const byId = id => document.getElementById(id);
const mode = byId("mode");
const delay = byId("delay");
const status = byId("status");
const setup = byId("setup");
const session = byId("session");
const counter = byId("counter-view");
const secondsDisplay = byId("seconds");
const modes = {
  S: ["Системное время", "Оба устройства начнут по указанному времени на своих часах."],
  M: ["Ручной старт", "Когда оба готовы, нажмите «Начать» под голосовой отсчёт."],
  U: ["Интернет-время", "Оба устройства сверятся с UTCTime перед запуском."]
};

let run = null;
let frame = 0;
let lastSecond = -1;
let busy = false;

function describeMode() {
  byId("mode-help").textContent = modes[mode.value][1];
  byId("delay-fields").hidden = mode.value === "M";
}

function message(text, isError = false) {
  session.hidden = false;
  status.textContent = text;
  status.toggleAttribute("data-error", isError);
}

function setBusy(value) {
  busy = value;
  byId("create-button").disabled = value;
  byId("join-button").disabled = value;
}

function clearRun() {
  cancelAnimationFrame(frame);
  run = null;
  lastSecond = -1;
  setup.hidden = false;
  counter.hidden = true;
  session.hidden = true;
  for (const id of ["share", "start", "cancel"]) byId(id).hidden = true;
  byId("details").textContent = "";
  byId("session-title").textContent = "Тест";
  byId("code").value = "";
  byId("copy").textContent = "Скопировать код";
  status.textContent = "";
}

function newTestId() {
  return Array.from(crypto.getRandomValues(new Uint8Array(6)), byte =>
    byte.toString(16).padStart(2, "0")
  ).join("");
}

function parseCode(code) {
  const match = /^SYNC1-([SMU])-([a-f0-9]{12})(?:-([0-9]{1,15}))?$/i.exec(code.trim());
  if (!match) throw new Error("Код не распознан. Проверь, что скопировал его целиком из этой версии стенда.");
  const source = match[1].toUpperCase();
  const startUtc = match[3] === undefined ? null : Number(match[3]);
  if ((source === "M") !== (startUtc === null) || (startUtc !== null && startUtc <= 0)) {
    throw new Error("В коде неверно указано время старта.");
  }
  return { source, id: match[2].toLowerCase(), startUtc };
}

async function sampleUtc() {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 2600);
  const start = performance.now();
  try {
    const response = await fetch("https://utctime.app/api/now?sample=" + newTestId(), {
      cache: "no-store",
      signal: controller.signal
    });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const payload = await response.json();
    const end = performance.now();
    if (!Number.isSafeInteger(payload.unix_ms) || payload.unix_ms < 1e12 || payload.unix_ms > 5e12) {
      throw new Error("Некорректная отметка UTC");
    }
    return { offset: payload.unix_ms - (start + end) / 2, duration: end - start };
  } finally {
    clearTimeout(timeout);
  }
}

async function clockOffset(source) {
  if (source === "S") return Date.now() - performance.now();
  if (source === "M") return null;

  message("Сверяем часы с UTCTime…");
  const samples = [];
  for (let i = 0; i < 3; i += 1) {
    try {
      samples.push(await sampleUtc());
    } catch {
      // A single failed request should not discard the other measurements.
    }
  }
  samples.sort((a, b) => a.duration - b.duration);
  const best = samples.find(sample => samples.some(other =>
    sample !== other && Math.abs(sample.offset - other.offset) <= 300
  ));
  if (!best) throw new Error("Не удалось надёжно сверить время с UTCTime. Проверь интернет и повтори тест либо создай новый тест в другом режиме.");
  return best.offset;
}

function stopTest(text, isError = false) {
  clearRun();
  message(text, isError);
}

function tick(now) {
  if (!run || run.startAt === null) return;
  const elapsed = now - run.startAt;
  const wall = Date.now();
  const paused = now - run.lastFrame > 5000 || Math.abs(wall - run.lastWall - (now - run.lastFrame)) > 5000;
  if (paused && elapsed >= 0) {
    stopTest("Отсчёт прерван: устройство было приостановлено или часы резко изменились. Создай новый тест.", true);
    return;
  }
  run.lastFrame = now;
  run.lastWall = wall;

  if (elapsed < 0) {
    const remaining = Math.ceil(-elapsed / 1000);
    if (remaining !== run.remaining) {
      run.remaining = remaining;
      message("До старта: " + remaining + " с");
    }
  } else {
    if (document.hidden) {
      stopTest("Страница была скрыта в момент старта. Создай новый тест.", true);
      return;
    }
    const second = Math.floor(elapsed / 1000);
    if (second !== lastSecond) {
      secondsDisplay.textContent = String(second);
      counter.dataset.parity = second % 2 === 0 ? "even" : "odd";
      lastSecond = second;
    }
    if (counter.hidden) {
      setup.hidden = true;
      counter.hidden = false;
      byId("stop").focus({ preventScroll: true });
    }
  }
  frame = requestAnimationFrame(tick);
}

function startAt(value) {
  run.startAt = value;
  run.lastFrame = performance.now();
  run.lastWall = Date.now();
  frame = requestAnimationFrame(tick);
}

function arm(test, offset, isHost) {
  const startTime = test.startUtc === null ? null : test.startUtc - offset;
  if (startTime !== null && startTime <= performance.now()) {
    throw new Error("Время старта прошло. На первом устройстве создай новый код с большей задержкой.");
  }

  run = { ...test, startAt: null, remaining: null };
  session.hidden = false;
  byId("session-title").textContent = modes[test.source][0];
  byId("details").textContent = (isHost ? "Создатель" : "Участник") + " · тест " + test.id;
  byId("cancel").hidden = false;
  if (isHost) {
    byId("code").value = "SYNC1-" + test.source + "-" + test.id +
      (test.startUtc === null ? "" : "-" + test.startUtc);
    byId("share").hidden = false;
  }

  if (startTime === null) {
    byId("start").hidden = false;
    message(isHost ? "Передай код. Когда оба готовы, нажмите «Начать» под отсчёт." :
      "Готово. Нажмите «Начать» вместе с создателем теста.");
  } else {
    startAt(startTime);
  }
}

async function prepare(isHost) {
  if (busy) return;
  clearRun();
  setBusy(true);
  try {
    const source = mode.value;
    const delaySeconds = Number(delay.value);
    const test = isHost ? { source, id: newTestId(), startUtc: null } :
      parseCode(byId("import-code").value);
    const offset = await clockOffset(test.source);
    if (isHost && test.source !== "M") {
      test.startUtc = Math.ceil(offset + performance.now() + delaySeconds * 1000);
    }
    arm(test, offset, isHost);
  } catch (error) {
    message(error.message, true);
  } finally {
    setBusy(false);
  }
}

mode.addEventListener("change", describeMode);
delay.addEventListener("input", () => {
  byId("delay-value").value = delay.value + " с";
});
byId("create").addEventListener("submit", event => {
  event.preventDefault();
  prepare(true);
});
byId("join").addEventListener("submit", event => {
  event.preventDefault();
  prepare(false);
});
byId("copy").addEventListener("click", async () => {
  const code = byId("code");
  try {
    await navigator.clipboard.writeText(code.value);
    byId("copy").textContent = "Код скопирован";
  } catch {
    code.select();
    byId("copy").textContent = "Код выделен · Ctrl+C / ⌘C";
  }
});
byId("start").addEventListener("click", () => {
  if (!run || run.startAt !== null) return;
  byId("start").hidden = true;
  startAt(performance.now());
});
byId("cancel").addEventListener("click", clearRun);
byId("stop").addEventListener("click", () => stopTest("Тест остановлен. Можно создать или принять новый код."));
document.addEventListener("visibilitychange", () => {
  if (!run || run.startAt === null) return;
  if (document.hidden) {
    if (performance.now() >= run.startAt) {
      stopTest("Страница была скрыта во время отсчёта. Создай новый тест.", true);
    }
    return;
  }
  if (performance.now() >= run.startAt && counter.hidden) {
    stopTest("Страница была скрыта в момент старта. Создай новый тест.", true);
    return;
  }
  // Switching windows to send a code during the countdown is allowed.
  run.lastFrame = performance.now();
  run.lastWall = Date.now();
});
describeMode();
</script>
</body>
</html>
